<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ميجاستور & بروجيكت واي | السجل المالي السريع</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root[data-theme="dark"] {
            --bg-base: #070B05;
            --card-surface: rgba(18, 26, 15, 0.95);
            --card-border: rgba(165, 170, 114, 0.25);
            --brand-gold: #D4AF37;
            --text-main: #F7EFE6;
            --text-muted: #B8BFA0;
            --item-bg: rgba(255, 255, 255, 0.05);
            --success: #4ade80;
            --danger: #f87171;
            --vodafone: #e11d48;
        }
        :root[data-theme="light"] {
            --bg-base: #EAE3D5;
            --card-surface: #F7EFE6;
            --card-border: rgba(120, 124, 68, 0.3);
            --brand-gold: #8B7322;
            --text-main: #1A2611;
            --text-muted: #5E6652;
            --item-bg: #FFFFFF;
            --success: #16a34a;
            --danger: #dc2626;
            --vodafone: #be123c;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-base); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px; }
        .container { width: 100%; max-width: 480px; background: var(--card-surface); border: 1px solid var(--card-border); border-radius: 24px; padding: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); position: relative; }
        
        #lockScreen { position: absolute; inset: 0; background: var(--card-surface); z-index: 100; border-radius: 24px; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--card-border); padding-bottom: 10px; }
        .title { font-size: 16px; font-weight: 900; color: var(--brand-gold); }
        .subtitle { font-size: 11px; color: var(--text-muted); }
        
        .summary-box { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 15px; }
        .stat-card { background: var(--item-bg); padding: 10px; border-radius: 12px; text-align: center; border: 1px solid var(--card-border); }
        .stat-label { font-size: 10px; color: var(--text-muted); }
        .stat-val { font-size: 13px; font-weight: 900; margin-top: 2px; }
        
        .form-group { margin-bottom: 8px; }
        .form-group label { display: block; font-size: 10px; color: var(--text-muted); margin-bottom: 2px; }
        .input-field { width: 100%; background: var(--bg-base); border: 1px solid var(--card-border); color: var(--text-main); padding: 8px 10px; border-radius: 8px; font-size: 12px; outline: none; }
        
        .btn { width: 100%; background: var(--brand-gold); color: #070B05; border: none; padding: 10px; border-radius: 8px; font-weight: 900; font-size: 13px; cursor: pointer; margin-top: 5px; }
        
        .list { max-height: 180px; overflow-y: auto; margin-top: 10px; }
        .item { background: var(--item-bg); padding: 8px 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 11px; border: 1px solid var(--card-border); }
        .del { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 12px; padding: 0 4px; }
        
        .actions { display: flex; gap: 8px; margin-top: 10px; }
        .action-btn { flex: 1; background: var(--item-bg); border: 1px solid var(--card-border); color: var(--text-main); padding: 8px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; text-align: center; }
        
        #pdfReportContainer { display: none; }
    </style>
</head>
<body>

    <div class="container" id="appContent">
        <!-- شاشة الحماية -->
        <div id="lockScreen">
            <h3 style="color: var(--brand-gold); margin-bottom: 5px;">🔐 تسجيل الدخول</h3>
            <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 15px;">كلمة المرور الافتراضية: 1234</p>
            <input type="password" id="passInput" class="input-field" placeholder="أدخل كلمة المرور..." style="margin-bottom: 10px; text-align: center;">
            <button class="btn" onclick="checkPass()">دخول</button>
        </div>

        <!-- رأس الصفحة -->
        <div class="header">
            <div>
                <div class="title">النظام المالي السريع</div>
                <div class="subtitle">المحصل: محمد أحمد</div>
            </div>
            <button onclick="document.getElementById('lockScreen').style.display='flex'" style="background:none; border:none; color:var(--brand-gold); cursor:pointer;">🔒</button>
        </div>

        <!-- الملخص السريع -->
        <div class="summary-box">
            <div class="stat-card">
                <div class="stat-label">تحصيلات كاش</div>
                <div class="stat-val" style="color: var(--success);" id="cCash">0 ج.م</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">فودافون كاش</div>
                <div class="stat-val" style="color: var(--vodafone);" id="cVod">0 ج.م</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">المصروفات</div>
                <div class="stat-val" style="color: var(--danger);" id="cExp">0 ج.م</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">الصافي بالخزينة</div>
                <div class="stat-val" style="color: var(--brand-gold);" id="cNet">0 ج.م</div>
            </div>
        </div>

        <!-- نموذج سريع للتسجيل -->
        <form onsubmit="addTx(event)" style="background: var(--item-bg); padding: 10px; border-radius: 12px; border: 1px solid var(--card-border);">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px;">
                <div class="form-group">
                    <label>الفرع</label>
                    <select id="branch" class="input-field">
                        <option value="سيدي جابر">سيدي جابر</option>
                        <option value="كفر الدوار">كفر الدوار</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>البرنامج</label>
                    <select id="prog" class="input-field">
                        <option value="ميجاستور">ميجاستور</option>
                        <option value="بروجيكت واي">بروجيكت واي</option>
                    </select>
                </div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px;">
                <div class="form-group">
                    <label>نوع الحركة</label>
                    <select id="type" class="input-field">
                        <option value="كاش">تحصيل كاش</option>
                        <option value="فودافون كاش">فودافون كاش</option>
                        <option value="مصروفات">مصروفات (-)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>المبلغ (ج.م)</label>
                    <input type="number" id="amt" class="input-field" step="0.01" required placeholder="0.00">
                </div>
            </div>
            <div class="form-group">
                <label>البيان أو اسم النسخة / العميل</label>
                <input type="text" id="desc" class="input-field" required placeholder="مثال: اشتراك دعم فني / نسخة جديدة">
            </div>
            <button type="submit" class="btn">حفظ الحركة فوراً</button>
        </form>

        <!-- الأزرار السفلية -->
        <div class="actions">
            <button class="action-btn" onclick="exportPDF()">📄 تصدير PDF</button>
            <button class="action-btn" onclick="clearAll()" style="color: var(--danger);">🗑️ مسح الكل</button>
        </div>

        <!-- قائمة الحركات -->
        <div style="font-size: 11px; font-weight: 800; color: var(--brand-gold); margin-top: 10px; margin-bottom: 4px;">آخر الحركات المسجلة:</div>
        <div class="list" id="txList"></div>
    </div>

    <!-- قالب الـ PDF البسيط والمرتب -->
    <div id="pdfReportContainer">
        <div style="direction: rtl; font-family: 'Cairo', sans-serif; padding: 15px; color: #111;">
            <h3 style="text-align: center; color: #23400D; margin-bottom: 4px;">التقرير المالي السريع</h3>
            <p style="font-size: 11px; color: #555; margin-bottom: 10px;">المحصل: <b>محمد أحمد</b> | التاريخ: <span id="pDate"></span></p>
            <table style="width: 100%; border-collapse: collapse; font-size: 10px;">
                <thead>
                    <tr style="background: #23400D; color: #fff;">
                        <th style="border: 1px solid #ddd; padding: 4px;">الفرع</th>
                        <th style="border: 1px solid #ddd; padding: 4px;">البرنامج</th>
                        <th style="border: 1px solid #ddd; padding: 4px;">النوع</th>
                        <th style="border: 1px solid #ddd; padding: 4px;">البيان</th>
                        <th style="border: 1px solid #ddd; padding: 4px;">المبلغ</th>
                    </tr>
                </thead>
                <tbody id="pBody"></tbody>
            </table>
            <div style="margin-top: 10px; font-weight: bold; font-size: 11px;" id="pSum"></div>
        </div>
    </div>

    <script>
        let data = JSON.parse(localStorage.getItem('fast_fin_data')) || [];

        function checkPass() {
            if(document.getElementById('passInput').value === '1234') {
                document.getElementById('lockScreen').style.display = 'none';
            } else {
                alert('كلمة المرور خطأ (جرب 1234)');
            }
        }

        function addTx(e) {
            e.preventDefault();
            const branch = document.getElementById('branch').value;
            const prog = document.getElementById('prog').value;
            const type = document.getElementById('type').value;
            const amt = parseFloat(document.getElementById('amt').value);
            const desc = document.getElementById('desc').value;
            const time = new Date().toLocaleDateString('ar-EG', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});

            data.unshift({ id: Date.now(), branch, prog, type, amt, desc, time });
            localStorage.setItem('fast_fin_data', JSON.stringify(data));
            e.target.reset();
            render();
        }

        function delTx(id) {
            if(confirm('حذف هذه الحركة؟')) {
                data = data.filter(x => x.id !== id);
                localStorage.setItem('fast_fin_data', JSON.stringify(data));
                render();
            }
        }

        function clearAll() {
            if(confirm('مسح كل السجلات؟')) {
                data = [];
                localStorage.setItem('fast_fin_data', JSON.stringify(data));
                render();
            }
        }

        function render() {
            let cash = 0, vod = 0, exp = 0;
            const list = document.getElementById('txList');
            const pBody = document.getElementById('pBody');
            list.innerHTML = '';
            pBody.innerHTML = '';

            if(data.length === 0) {
                list.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:10px;">لا توجد حركات مسجلة</div>';
            }

            data.forEach(x => {
                if(x.type === 'كاش') cash += x.amt;
                else if(x.type === 'فودافون كاش') vod += x.amt;
                else exp += x.amt;

                // واجهة التطبيق
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `
                    <div>
                        <b>[${x.branch}] ${x.desc}</b><br>
                        <span style="color:var(--text-muted);">${x.prog} - ${x.type} (${x.time})</span>
                    </div>
                    <div style="display:flex; align-items:center; gap:6px;">
                        <span style="font-weight:900; color:${x.type==='مصروفات'?'var(--danger)':(x.type==='فودافون كاش'?'var(--vodafone)':'var(--success)')};">
                            ${x.type==='مصروفات'?'-':'+'}${x.amt} ج.م
                        </span>
                        <button class="del" onclick="delTx(${x.id})">✕</button>
                    </div>
                `;
                list.appendChild(div);

                // جدول الـ PDF
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="border: 1px solid #ddd; padding: 4px;">${x.branch}</td>
                    <td style="border: 1px solid #ddd; padding: 4px;">${x.prog}</td>
                    <td style="border: 1px solid #ddd; padding: 4px;">${x.type}</td>
                    <td style="border: 1px solid #ddd; padding: 4px;">${x.desc}</td>
                    <td style="border: 1px solid #ddd; padding: 4px; font-weight:bold;">${x.amt} ج.م</td>
                `;
                pBody.appendChild(tr);
            });

            document.getElementById('cCash').innerText = cash + ' ج.م';
            document.getElementById('cVod').innerText = vod + ' ج.م';
            document.getElementById('cExp').innerText = exp + ' ج.م';
            const net = (cash + vod) - exp;
            document.getElementById('cNet').innerText = net + ' ج.م';

            document.getElementById('pSum').innerText = `إجمالي الكاش: ${cash} | فودافون: ${vod} | المصروفات: ${exp} | الصافي: ${net} ج.م`;
            document.getElementById('pDate').innerText = new Date().toLocaleDateString('ar-EG');
        }

        function exportPDF() {
            const el = document.getElementById('pdfReportContainer');
            el.style.display = 'block';
            html2pdf().from(el).set({ margin: 10, filename: 'Report_Muhammad_Ahmed.pdf', jsPDF: {format: 'a4'} }).save().then(() => {
                el.style.display = 'none';
            });
        }

        render();
    </script>
</body>
</html>
