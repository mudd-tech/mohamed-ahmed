<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة التحصيلات والإيرادات | Tapio Solutions</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- مكتبة تصدير PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root[data-theme="dark"] {
            --bg-base: #070B05;
            --card-surface: rgba(18, 26, 15, 0.95);
            --card-border: rgba(165, 170, 114, 0.25);
            --brand-gold: #D4AF37;
            --brand-olive: #787C44;
            --text-main: #F7EFE6;
            --text-muted: #B8BFA0;
            --item-bg: rgba(255, 255, 255, 0.04);
            --item-border: rgba(255, 255, 255, 0.08);
            --success: #4ade80;
            --danger: #f87171;
            --shadow-color: rgba(0, 0, 0, 0.8);
        }

        :root[data-theme="light"] {
            --bg-base: #EAE3D5;
            --card-surface: #F7EFE6;
            --card-border: rgba(120, 124, 68, 0.3);
            --brand-gold: #8B7322;
            --brand-olive: #787C44;
            --text-main: #1A2611;
            --text-muted: #5E6652;
            --item-bg: #FFFFFF;
            --item-border: rgba(35, 64, 13, 0.12);
            --success: #16a34a;
            --danger: #dc2626;
            --shadow-color: rgba(26, 38, 17, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--card-surface);
            backdrop-filter: blur(25px);
            border: 1px solid var(--card-border);
            border-radius: 32px;
            padding: 24px 18px;
            box-shadow: 0 30px 80px var(--shadow-color);
            position: relative;
        }

        /* شاشة القفل والأمان */
        #lockScreen {
            position: absolute;
            inset: 0;
            background: var(--card-surface);
            z-index: 100;
            border-radius: 32px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
        }

        .lock-title {
            font-size: 20px;
            font-weight: 800;
            color: var(--brand-gold);
            margin-bottom: 8px;
        }

        .lock-desc {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        /* رأس التطبيق */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--item-border);
            padding-bottom: 14px;
        }

        .app-title {
            font-size: 18px;
            font-weight: 900;
            color: var(--brand-gold);
        }

        .app-sub {
            font-size: 11px;
            color: var(--text-muted);
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: var(--item-bg);
            border: 1px solid var(--card-border);
            color: var(--brand-gold);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
        }

        /* لوحة الملخص المالي */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .summary-card {
            background: var(--item-bg);
            border: 1px solid var(--item-border);
            border-radius: 14px;
            padding: 10px 6px;
            text-align: center;
        }

        .summary-label {
            font-size: 10.5px;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .summary-value {
            font-size: 13.5px;
            font-weight: 900;
        }

        .text-inc { color: var(--success); }
        .text-exp { color: var(--danger); }
        .text-net { color: var(--brand-gold); }

        /* نموذج الإدخال */
        .form-card {
            background: var(--item-bg);
            border: 1px solid var(--item-border);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .form-title {
            font-size: 13px;
            font-weight: 800;
            color: var(--brand-gold);
            margin-bottom: 12px;
        }

        .input-group {
            margin-bottom: 10px;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .input-field, select.input-field {
            width: 100%;
            background: var(--card-surface);
            border: 1px solid var(--item-border);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13.5px;
            font-weight: 600;
            outline: none;
        }

        .input-field:focus {
            border-color: var(--brand-gold);
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--brand-gold) 0%, #b8972d 100%);
            color: #070B05;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
            margin-top: 6px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        /* أزرار الإجراءات السفلية (تقرير وتصدير) */
        .action-row {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        .action-btn-custom {
            flex: 1;
            background: var(--item-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 10px;
            border-radius: 12px;
            font-size: 12.5px;
            font-weight: 800;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
        }

        .action-btn-custom:hover {
            border-color: var(--brand-gold);
            color: var(--brand-gold);
        }

        /* جدول المعاملات الأحدث */
        .transactions-section {
            max-height: 220px;
            overflow-y: auto;
            margin-bottom: 14px;
        }

        .transaction-item {
            background: var(--item-bg);
            border: 1px solid var(--item-border);
            border-radius: 12px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .t-info h4 {
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 2px;
        }

        .t-info span {
            font-size: 10.5px;
            color: var(--text-muted);
        }

        .t-amount {
            font-size: 13.5px;
            font-weight: 900;
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 14px;
            margin-right: 8px;
        }

        .footer-credit {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            border-top: 1px solid var(--item-border);
            padding-top: 12px;
        }

        .footer-credit span {
            color: var(--brand-gold);
            font-weight: 900;
        }
    </style>
</head>
<body>

    <div class="app-container" id="appContent">
        <!-- شاشة الأمان وكلمة المرور -->
        <div id="lockScreen">
            <div class="lock-title">🔐 حماية بيانات الشركة</div>
            <div class="lock-desc" id="lockDesc">أدخل كلمة المرور لفتح سجلات التحصيل والإيرادات</div>
            <div class="input-group" style="width: 100%;">
                <input type="password" id="passInput" class="input-field" placeholder="كلمة المرور...">
            </div>
            <button class="submit-btn" onclick="verifyPassword()">دخول آمن</button>
        </div>

        <!-- رأس التطبيق -->
        <header class="app-header">
            <div>
                <div class="app-title">نظام التحصيل الذكي</div>
                <div class="app-sub">الإيرادات والمصروفات اليومية</div>
            </div>
            <div class="header-actions">
                <button class="icon-btn" onclick="toggleTheme()" title="تغيير المظهر">🌓</button>
                <button class="icon-btn" onclick="lockApp()" title="قفل التطبيق">🔒</button>
            </div>
        </header>

        <!-- ملخص الحسابات -->
        <div class="summary-grid">
            <div class="summary-card">
                <div class="summary-label">إجمالي الإيرادات</div>
                <div class="summary-value text-inc" id="totalInc">0 ج.م</div>
            </div>
            <div class="summary-card">
                <div class="summary-label">إجمالي المصروفات</div>
                <div class="summary-value text-exp" id="totalExp">0 ج.م</div>
            </div>
            <div class="summary-card">
                <div class="summary-label">صافي الخزينة</div>
                <div class="summary-value text-net" id="netBalance">0 ج.م</div>
            </div>
        </div>

        <!-- نموذج إضافة حركة جديدة -->
        <div class="form-card">
            <div class="form-title">➕ تسجيل حركة مالية جديدة</div>
            <form id="transForm" onsubmit="addTransaction(event)">
                <div class="input-group">
                    <label>نوع الحركة</label>
                    <select id="type" class="input-field">
                        <option value="inc">تحصيل إيراد (+)</option>
                        <option value="exp">صرف مصروف (-)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>المبلغ (ج.م)</label>
                    <input type="number" id="amount" class="input-field" step="0.01" required placeholder="0.00">
                </div>
                <div class="input-group">
                    <label>البيان / اسم العميل أو الجهة</label>
                    <input type="text" id="desc" class="input-field" required placeholder="مثال: تحصيل فاتورة عميل / شراء أدوات">
                </div>
                <button type="submit" class="submit-btn">حفظ وتحديث الحسابات</button>
            </form>
        </div>

        <!-- أزرار التقارير والتصدير -->
        <div class="action-row">
            <button class="action-btn-custom" onclick="exportPDF()">📄 تصدير تقرير PDF</button>
            <button class="action-btn-custom" onclick="clearData()" style="color: var(--danger);">🗑️ مسح الكل</button>
        </div>

        <!-- قائمة أحدث المعاملات -->
        <div style="font-size: 12px; font-weight: 800; color: var(--brand-gold); margin-bottom: 8px;">سجل الحركات الأخيرة:</div>
        <div class="transactions-section" id="transList">
            <!-- تُعبأ برمجياً -->
        </div>

        <footer class="footer-credit">
            Secured & Powered by <span>Tapio</span>
        </footer>
    </div>

        let transactions = JSON.parse(localStorage.getItem('tapio_transactions')) || [];
        let appPassword = localStorage.getItem('tapio_pass') || '1234'; // كلمة المرور الافتراضية 1234
